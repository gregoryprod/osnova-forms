server {
    listen 80;
    server_name forms.osnova-mind.ru;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name forms.osnova-mind.ru;
    ssl_certificate /etc/letsencrypt/live/forms.osnova-mind.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forms.osnova-mind.ru/privkey.pem;
    client_max_body_size 16k;
    # Avoid recording referrers, queries or remote IPs in this service's access log.
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite untrusted client-supplied forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
